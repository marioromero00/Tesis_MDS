const DATA=[{"chapter": "TESIS MDS / AVANCE EXPERIMENTAL", "title": "¿Qué aporta el historial<br>a la predicción de atención<br>y activación?", "body": "<p class=\"cover-sub\">Desarrollo y revisión de modelos multimodales<br>durante la navegación web</p><div class=\"byline\"><b>Mario</b><span>Magíster en Ciencia de Datos<br>Avance de tesis · noviembre de 2026</span></div>", "notes": "Versión inicial para discutir con el profesor. El recorrido diferencia hechos verificados, resultados históricos y decisiones aún abiertas. Los resultados de activación anteriores a GSR V2 no se usan para sostener la hipótesis.", "source": "documentacion/Cierre_Experimental_V2_01-11-2026.md", "kind": "story-cover"}, {"chapter": "01 / DISEÑO DE LA INVESTIGACIÓN", "title": "La pregunta inicial", "body": "<div class=\"editorial-pair\"><div><p class=\"opening\">Una ventana muestra<br>un momento.<br><span>El historial permite<br>observar cambios.</span></p></div><div><h3>Lo que quería contrastar</h3><p class=\"prose\">Si un modelo que incorpora ventanas anteriores predice mejor que uno que recibe solo la ventana actual.</p><p class=\"prose\">La hipótesis exige esa mejora en atención y activación.</p></div></div>", "notes": "La tesis parte de la temporalidad y la fusión multimodal. El contraste más reciente usa estadísticas del historial; no demuestra por sí solo que el orden de la secuencia aporte información.", "source": "../../documentos/01 Tesis MDS/Marco Teorico/Problema e hipótesis.md", "kind": ""}, {"chapter": "01 / DISEÑO DE LA INVESTIGACIÓN", "title": "Antes de entrenar, había que definir qué predecir", "body": "<p class=\"intro\">Los registros contienen señales, pero no una etiqueta directa de atención o activación.</p><table><thead><tr><th>Objetivo</th><th>Construcción de la etiqueta</th><th>Señales para predecirla</th></tr></thead><tbody><tr><td>Atención</td><td>Mirada + pupila</td><td>EEG + GSR</td></tr><tr><td>Activación</td><td>GSR</td><td>EEG + mirada + pupila</td></tr></tbody></table><p class=\"caption\">Las señales usadas para construir una etiqueta se excluyen de los predictores de esa tarea.</p>", "notes": "El profesor es una regla de construcción de pseudoetiquetas, no una verdad externa. La separación reduce circularidad directa. Normalización y umbrales personales del profesor siguen siendo offline.", "source": "resultados/profesor_binario_reconstruido_29-10-2026/INFORME.md; resultados/etiquetas_gsr_calidad_v2_01-11-2026/INFORME.md", "kind": ""}, {"chapter": "01 / DISEÑO DE LA INVESTIGACIÓN", "title": "La evaluación quedó separada por persona", "body": "<div class=\"split-counts\"><div><b>25</b><span>Entrenamiento</span></div><div><b>8</b><span>Validación</span></div><div><b>8</b><span>Test</span></div></div><div class=\"method-line\"><span><b>2 s</b> por ventana</span><span><b>1 s</b> de desplazamiento</span><span><b>41</b> personas en el análisis principal</span></div><p class=\"caption\">Las ventanas solapadas no se tratan como participantes independientes. Validación y test tienen exposición histórica.</p>", "notes": "41 participantes en las particiones principales. P29 se mantiene fuera del análisis principal por sensibilidad de sincronización. Los recuentos de ventanas cambian según la tarea y la versión de etiquetas. Validación y test tienen exposición histórica.", "source": "resultados/modelado/particion_participantes.csv; documentacion/Modelos_Temporales_07-09-2026.md", "kind": ""}, {"chapter": "02 / PRIMEROS EXPERIMENTOS", "title": "Primero comparé modelos y formas de usar el historial", "body": "<table><thead><tr><th>Etapa</th><th>Qué se evaluó</th><th>Qué debía controlar</th></tr></thead><tbody><tr><td>Baselines</td><td>Logística y modelos de árboles</td><td>Referencia con ventana actual</td></tr><tr><td>Redes temporales</td><td>TCN, LSTM y BiLSTM</td><td>Aporte del historial frente a la arquitectura</td></tr><tr><td>Fusión</td><td>Combinaciones de modalidades</td><td>Ganancia respecto de sensores individuales</td></tr></tbody></table><p class=\"caption\">Septiembre de 2026. Los objetivos y etiquetas de esta etapa difieren de la versión corregida actual.</p>", "notes": "En septiembre se guardaron 104 redes en la primera comparación temporal. También se exploraron fusión temprana y tardía, selección de variables, ensambles y otras arquitecturas. No se trasladan métricas antiguas al objetivo binario V2. La auditoría posterior detectó un problema en el generador histórico.", "source": "documentacion/Modelos_Temporales_07-09-2026.md; documentacion/Fusiones_10-09-2026.md; resultados/etiquetas_gsr_calidad_v2_01-11-2026/INFORME.md", "kind": ""}, {"chapter": "03 / RECONSTRUCCIÓN DE ATENCIÓN", "title": "Después reconstruí atención y recuperé el EEG por canal", "body": "<div class=\"editorial-pair\"><div><h3>La etiqueta</h3><p class=\"prose\">Recalculé el profesor de atención desde las características de mirada y pupila.</p><p class=\"prose\">Comparé una combinación igualitaria con PCA, ajustado dentro de cada fold.</p></div><div><h3>Los predictores</h3><p class=\"feature-count\">16 <span>canales</span></p><p class=\"prose\">La extracción incorporó 342 entradas EEG nuevas, en lugar de resumir todos los canales.</p></div></div><p class=\"caption\">Octubre de 2026. Datos crudos recuperados y extracción alineada con las ventanas originales.</p>", "notes": "La etapa previa agregaba EEG entre canales. Se recuperaron archivos crudos, verificando integridad, y se extrajeron características por canal. Se comprobaron muestras y selección temporal contra el procesamiento anterior. No se atribuye localización anatómica sin mapa de electrodos.", "source": "documentacion/Crudos_V2_y_EEG_Por_Canal_29-10-2026.md; resultados/temporalidad_eeg_v2_test_29-10-2026/auditoria_extraccion.json; resultados/profesor_binario_reconstruido_29-10-2026/INFORME.md", "kind": ""}, {"chapter": "03 / RESULTADOS DE ATENCIÓN", "title": "El resultado de atención llegó a 0,6744", "body": "<div class=\"editorial-pair\"><div><div class=\"result-number\">0,6744</div><p class=\"metric-label\">AUC test · CatBoost estático</p><p class=\"secondary-number\">0,6798 <span>en validación</span></p></div><div><h3>Qué representa este resultado</h3><p class=\"prose\">Discriminación de las pseudoetiquetas de atención en ocho personas de test.</p><p class=\"prose\">Para evaluar la temporalidad, faltaba comparar el historial con un estático equivalente.</p></div></div>", "notes": "La comparación mantiene familia y parámetros emparejados. Es el contraste histórico principal del 29 de octubre y no debe confundirse con la comparación contra CatBoost 0,6744. IC bootstrap pareado descriptivo; test previamente consultado.", "source": "resultados/temporalidad_eeg_v2_test_29-10-2026/INFORME.md", "kind": "result-slide"}, {"chapter": "03 / RESULTADOS DE ATENCIÓN", "title": "El historial subió la AUC de 0,6602 a 0,6879", "body": "<table><thead><tr><th>HistGradientBoosting · test</th><th>AUC</th><th>IC95% descriptivo</th></tr></thead><tbody><tr><td>Ventana actual</td><td>0,6602</td><td>[0,6139; 0,7043]</td></tr><tr><td>Historial hasta 32 ventanas</td><td>0,6879</td><td>[0,6434; 0,7304]</td></tr></tbody></table><div class=\"contrast-line\"><strong>+0,0277</strong><span>ΔAUC<br>IC95% [−0,0041; +0,0505]</span><p>Mejora en 7 de 8 personas.<br>El intervalo incluye cero.</p></div>", "notes": "La comparación mantiene familia y parámetros emparejados. Es el contraste histórico principal del 29 de octubre y no debe confundirse con la comparación contra CatBoost 0,6744. IC bootstrap pareado descriptivo; test previamente consultado.", "source": "resultados/temporalidad_eeg_v2_test_29-10-2026/INFORME.md", "kind": ""}, {"chapter": "03 / RESULTADOS DE ATENCIÓN", "title": "La representación también cambió el resultado", "body": "<figure class=\"data-figure\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAB7wAAALQCAYAAAAD2w8gAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwS figure>", "notes": "La comparación común del 30 de octubre usa media y desviación histórica de todas las variables. No es la misma representación de la diapositiva anterior. Debe conservarse este resultado favorable, pero no presentarlo como réplica confirmatoria independiente ni como justificación de elegir una representación después de ver test.", "source": "resultados/comparacion_comun_binaria_30-10-2026/INFORME.md", "kind": ""}, {"chapter": "04 / REVISIÓN DE ACTIVACIÓN", "title": "En activación aparecieron problemas con las etiquetas", "body": "<div class=\"editorial-pair\"><div><p class=\"person-id\">P4</p><p class=\"opening\">Solo el <b>12,6%</b><br>de sus ventanas<br>tenía GSR válido.</p></div><div><h3>Sin embargo, todas recibían etiqueta</h3><p class=\"prose\">También aparecieron empates, clases desbalanceadas y poco historial completo.</p><p class=\"prose\">La prioridad pasó a ser auditar el objetivo antes de seguir ajustando modelos.</p></div></div>", "notes": "P34 tenía aproximadamente 8,6% de positivos bajo la etiqueta binaria anterior. El diagnóstico de 60 ajustes internos y 15 modelos externos se reprodujo, pero reproducibilidad no equivale a validez del objetivo. Sus resultados se consideran históricos, no evidencia con GSR V2.", "source": "resultados/activacion_diagnostico_nested_30-10-2026/INFORME.md; ../../notas/bitacora.md", "kind": ""}, {"chapter": "04 / REVISIÓN DE ACTIVACIÓN", "title": "La auditoría confirmó un error de índices", "body": "<p class=\"intro\">Al agrupar por participante y reiniciar los índices,<br>los componentes GSR se asignaban a otras ventanas.</p><div class=\"audit-layout\"><div><b>25.498</b><span>posiciones desplazadas<br>de 25.992 en el archivo completo</span></div><div><p>El cálculo con ese error reprodujo<br>los scores históricos guardados.</p><p>Los AUC de activación basados en esas<br>etiquetas dejaron de ser evidencia válida.</p></div></div><p class=\"caption\">La cifra cuenta posiciones de componentes, no etiquetas binarias que cambiaron.</p>", "notes": "La operación groupby/apply seguida de reset_index descartaba los índices originales. Las cifras corresponden al archivo completo, incluidos participantes fuera del análisis principal; no son el número de etiquetas binarias que cambiaron. Los errores máximos de reproducción fueron 4,82e-7 y 2,92e-7, compatibles con precisión de exportación. El patrón también aparece en atención histórica; no se extrapola a profesores reconstruidos posteriores.", "source": "resultados/etiquetas_gsr_calidad_v2_01-11-2026/INFORME.md; resultados/etiquetas_gsr_calidad_v2_01-11-2026/auditoria_independiente_02-11-2026.json", "kind": ""}, {"chapter": "04 / ETIQUETAS GSR V2", "title": "Reconstruí las etiquetas conservando cada ventana", "body": "<table><thead><tr><th>Paso</th><th>Regla de GSR V2</th></tr></thead><tbody><tr><td>1 · Calidad</td><td>Cobertura ≥50%; cuatro componentes finitos; SCR no negativos</td></tr><tr><td>2 · Normalización</td><td>Solo ventanas válidas; identidad e índices conservados</td></tr><tr><td>3 · Contexto</td><td>Cinco ventanas consecutivas válidas para el score de 6 s</td></tr><tr><td>4 · Clase</td><td>Mediana personal; empates y scores constantes sin etiqueta</td></tr></tbody></table><p class=\"caption\">El contexto se reinicia ante huecos o cambios de estímulo. La etiqueta sigue siendo relativa a la sesión y offline.</p>", "notes": "Cinco ventanas de dos segundos, desplazadas un segundo, cubren seis segundos. Los componentes observados constantes aportan cero; ausencias no se rellenan con cero. La mediana y normalización son offline. Esta revisión opera sobre características derivadas, no incorpora un detector fisiológico nuevo sobre señal cruda.", "source": "resultados/etiquetas_gsr_calidad_v2_01-11-2026/INFORME.md", "kind": ""}, {"chapter": "04 / ETIQUETAS GSR V2", "title": "La corrección dejó 11.796 ventanas etiquetables", "body": "<figure class=\"data-figure\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAB7wAA de Muestra 2 corresponde a registros de navegación web de 2025. No hay expresión facial en este conjunto. El alcance de cada señal debe distinguirse del constructo psicológico que se pretende aproximar.", "source": "../../documentos/01 Tesis MDS/Marco Teorico/Problema e hipótesis.md", "kind": ""}, {"chapter": "ANEXO / DETALLE METODOLÓGICO", "title": "Cómo se calculó la AUC", "body": "<div class=\"columns\"><div><div class=\"hero-metric small\">0,50<span>referencia de discriminación aleatoria</span></div></div><div><div class=\"hero-metric small\">1,00<span>ordenamiento perfecto de las dos clases</span></div></div></div><p class=\"lead\">AUC ≠ porcentaje de aciertos</p><p class=\"caption\">Promediamos AUC por persona y comparamos diferencias dentro de cada persona.</p>", "notes": "Una AUC cercana a 0,67 no significa 67% de etiquetas correctas a un umbral dado. La discriminación se refiere a las pseudoetiquetas definidas. Para la hipótesis importa ΔAUC temporal menos estático y su incertidumbre, no superar un valor aislado.", "source": "resultados/temporalidad_eeg_v2_test_29-10-2026/INFORME.md", "kind": ""}, {"chapter": "ANEXO / DETALLE METODOLÓGICO", "title": "Regla de decisión propuesta", "body": "<p class=\"lead\">Fijar qué mejora queremos demostrar<br>y contrastarla en participantes nuevos.</p><table><thead><tr><th>Paso</th><th>Decisión pendiente</th></tr></thead><tbody><tr><td>Efecto relevante</td><td>Justificar el margen; +0,02 AUC es solo un escenario</td></tr><tr><td>Comparación</td><td>Modelos, etiquetas y contexto principal fijados</td></tr><tr><td>Evaluación</td><td>Mismas personas y ventanas por tarea; incertidumbre pareada</td></tr></tbody></table><p class=\"caption\">Con un margen positivo se prueba una mejora relevante, no la mera existencia de cualquier mejora.</p>", "notes": "El protocolo propuesto usa intervalos simultáneos en ambas tareas. Respaldo si ambos límites inferiores superan el margen; refutación de esa afirmación acotada si algún límite superior queda debajo; si cruzan el margen, el resultado sigue inconcluso. Un diseño honesto no garantiza una decisión binaria.", "source": "resultados/protocolo_hipotesis_reintento_06-11-2026/INFORME.md", "kind": ""}, {"chapter": "ANEXO / DETALLE METODOLÓGICO", "title": "Escenarios de tamaño de muestra", "body": "<table><thead><tr><th>Escenario piloto</th><th>Personas nuevas evaluables</th></tr></thead><tbody><tr><td>Atención · dispersión del test histórico</td><td>62</td></tr><tr><td>Activación · dispersión de validación</td><td>72</td></tr><tr><td>Activación · dispersión de test</td><td>101</td></tr><tr><td>Activación · dispersión de OOF train</td><td>767</td></tr></tbody></table><p class=\"caption\">Escenario: margen 0,02 y efecto verdadero 0,04 o 0,00. Estas cifras no son una recomendación definitiva de reclutamiento.</p>", "notes": "Potencia 90% por tarea, intervalos bilaterales de 97,5% para control simultáneo. Se verificó el cálculo con 100.000 simulaciones por escenario bajo normalidad. Las varianzas externas usan ocho personas y OOF mezcla modelos de folds distintos; 767 es sensibilidad conservadora, no requerimiento demostrado. El estudio conjunto no suma los N si las personas son las mismas. El margen carece aún de justificación sustantiva independiente.", "source": "resultados/protocolo_hipotesis_reintento_06-11-2026/INFORME.md; resultados/protocolo_hipotesis_reintento_06-11-2026/verificacion_simulada.json", "kind": ""}, {"chapter": "ANEXO / DETALLE METODOLÓGICO", "title": "Fuentes y resultados reproducibles", "body": "<ol class=\"sources\"><li>Problema e hipótesis · manuscrito de investigación</li><li>Primeras redes y fusión · septiembre de 2026</li><li>Profesor reconstruido y EEG por canal · 29 de octubre</li><li>Temporalidad de atención y comparación común · 29–30 de octubre</li><li>GSR V2, auditoría y recálculo · 1–2 de noviembre</li><li>Ablaciones V2 y protocolo prospectivo · noviembre de 2026</li></ol><p class=\"caption\">Las notas de cada diapositiva incluyen su fuente local y las precisiones metodológicas.</p>", "notes": "Todas las cifras proceden de los informes y tablas locales. Las comparaciones con etiquetas anteriores se presentan como historia de desarrollo. Consultar FUENTES.md para rutas completas y GUIÓN.md para el contenido y notas de toda la presentación.", "source": "FUENTES.md", "kind": ""}];

const slides=[...document.querySelectorAll('.slide')];let index=0,lastFocus=null;

function sourceLink(src){let target;if(src==='FUENTES.md')target=src;else if(src.startsWith('../../../'))target='../../'+src;else if(src.startsWith('../../notas'))target='../../'+src;else target='../../'+src;const a=document.createElement('a');a.href=target;a.textContent=src;a.target='_blank';a.rel='noopener';return a}

addEventListener('keydown',e=>{const dialog=[...document.querySelectorAll('.dialog')].find(d=>!d.hidden);if(dialog){if(e.key==='Escape'){closeDialogs();e.preventDefault()}if(e.key==='Tab'){const focus=[...dialog.querySelectorAll('button,a')];const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}return}if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('button,a')&&[' ','Enter'].includes(e.key))return;if(['ArrowRight','PageDown',' '].includes(e.key)){show(index+1);e.preventDefault()}if(['ArrowLeft','PageUp'].includes(e.key)){show(index-1);e.preventDefault()}if(e.key==='Home')show(0);if(e.key==='End')show(DATA.length-1);if(e.key.toLowerCase()==='n')notes();if(e.key.toLowerCase()==='i')openDialog('overview-panel')});
