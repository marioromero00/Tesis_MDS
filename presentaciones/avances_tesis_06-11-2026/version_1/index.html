;line-height:1;font-weight:400;margin:15px 0 40px}.hero-metric span{display:block;font-size:21px;letter-spacing:0;line-height:1.4;margin-top:18px;color:var(--muted)}.hero-metric.small{font-size:76px;letter-spacing:-3px}.delta{font-size:61px;letter-spacing:-2px;margin-top:30px}.delta span{font-size:23px;letter-spacing:0;margin-left:20px}.timeline{display:grid;grid-template-columns:repeat(4,1fr);margin-top:70px;gap:26px}.timeline div{border-top:2px solid var(--ink);padding-top:22px}.timeline b{font-size:23px}.timeline p{font-size:22px;margin-top:22px}.steps{padding:0;list-style:none;counter-reset:item;margin:0}.steps li{position:relative;padding:16px 0 21px 65px;border-bottom:1px solid var(--line);counter-increment:item}.steps li:before{content:'0'counter(item);position:absolute;left:0;top:18px;font-size:21px;color:var(--muted)}.steps b{display:block;font-size:27px;font-weight:500;margin-bottom:9px}.steps span{font-size:21px;line-height:1.4;color:#536158}.sources{font-size:25px;line-height:1.5;padding-left:30px}.sources li{margin:15px 0}.cover{background:#183a31;color:var(--paper)}.cover .chapter{color:#c2d5bc}.cover h1{font-size:76px;max-width:1000px;letter-spacing:-3px;margin-top:65px}.cover .lead{font-size:29px;color:#d5dfd0}.cover-meta{font-size:18px;line-height:1.5;margin-top:55px;color:#c2d5bc}.closing{background:#e5ecdf}.folio{position:absolute;bottom:25px;right:38px;font-size:14px;color:var(--muted)}.cover .folio{color:#c2d5bc}.slide aside{display:none}nav{height:62px;padding:0 25px;display:flex;align-items:center;gap:12px;background:var(--paper);border-top:1px solid var(--line)}nav button{border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:4px;font-size:14px}nav button:hover{background:#e4eadf}#counter{font-size:14px;font-variant-numeric:tabular-nums;min-width:60px;text-align:center}.spacer{flex:1}#progress{height:3px;background:var(--ink);position:fixed;bottom:0;left:0;transition:width .2s}.dialog{position:fixed;inset:8vh 8vw;background:var(--paper);z-index:5;padding:30px 42px;overflow:auto;border:1px solid var(--line);box-shadow:0 25px 100px #183a3140}.dialog[hidden]{display:none}.dialog h2{font-size:28px;font-weight:500}.dialog p{font-size:18px}.dialog a{color:var(--ink);overflow-wrap:anywhere}.close{float:right;border:0;background:none;font-size:22px;padding:8px}.index-list{display:grid;grid-template-columns:1fr 1fr;gap:4px 35px}.index-list button{text-align:left;font-size:17px;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;line-height:1.3}.index-list span{color:var(--muted);padding-right:12px}.reading #stage{display:block;height:auto;overflow:visible}.reading .slide{display:block;transform:none!important;width:min(100%,1280px);height:auto;min-height:720px;margin:24px auto}.reading nav{position:sticky;bottom:0}.reading #progress{display:none}@media(max-width:650px){nav{padding:0 5px;gap:0}nav button{padding:10px 8px;font-size:12px}.hide-mobile{display:none}.dialog{inset:3vh 3vw;padding:20px}.index-list{grid-template-columns:1fr}.reading .slide{padding:40px 24px;min-height:0;margin:12px auto}.reading h1{font-size:32px;letter-spacing:-1px}.reading p,.reading .lead{font-size:20px}.reading .columns,.reading .timeline{grid-template-columns:1fr;gap:20px}.reading .numbers{gap:25px;flex-wrap:wrap}.reading .numbers strong{font-size:60px;letter-spacing:-3px}.reading .hero-metric{font-size:65px;letter-spacing:-3px}.reading .hero-metric.small{font-size:48px}.reading table{font-size:15px}.reading th{font-size:10px}.reading td{padding:14px 10px 14px 0}.reading .delta{font-size:40px}.reading .delta span{display:block;margin:12px 0;font-size:18px}.reading blockquote{font-size:25px}.reading .steps b{font-size:23px}.reading .steps span{font-size:18px}.reading .chapter{font-size:11px}.reading .folio{display:none}.reading .cover h1{margin-top:20px;font-size:42px}.reading .sources{font-size:18px}.reading .takeaway{font-size:18px}.reading .timeline{margin-top:25px}}@media print{@page{size:landscape;margin:0}body{background:white}#stage,.reading #stage{display:block;height:auto;overflow:visible}.slide,.slide.active,.reading .slide{display:block!important;transform:none!important;width:297mm;height:167mm;min-height:0;margin:0;padding:14mm 19mm;page-break-after:always;break-after:page;zoom:.88;print-color-adjust:exact;-webkit-print-color-adjust:exact}nav,#progress,.dialog{display:none!important}}
</style></head><body><main id="stage" aria-label="Presentación de avances"></main><nav aria-label="Controles de presentación"><button id="prev" aria-label="Diapositiva anterior">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Diapositiva siguiente">→</button><button id="overview">Índice</button><button id="notes-button">Notas</button><div class="spacer"></div><button id="read">Lectura</button><button id="full" class="hide-mobile">Pantalla completa</button><button id="print" class="hide-mobile">Imprimir</button></nav><div id="progress"></div><section class="dialog" id="notes" role="dialog" aria-modal="true" aria-labelledby="note-title" hidden><button class="close" aria-label="Cerrar notas">×</button><h2 id="note-title"></h2><p id="note-text"></p><h3>Fuentes</h3><div id="note-sources"></div></section><section class="dialog" id="overview-panel" role="dialog" aria-modal="true" aria-labelledby="overview-title" hidden><button class="close" aria-label="Cerrar índice">×</button><h2 id="overview-title">Recorrido de la presentación</h2><div class="index-list"></div></section><script>
const DATA=[{"chapter": "TESIS MDS · AVANCES AL 6 NOV 2026", "title": "Temporalidad y<br>señales multimodales", "body": "<p class=\"lead\">Predicción de atención y activación<br>durante la navegación web</p><div class=\"cover-meta\">Mario · Avances de investigación<br>Problema, experimentos, auditorías y próximos pasos</div>", "notes": "Versión inicial para discutir con el profesor. El recorrido diferencia hechos verificados, resultados históricos y decisiones aún abiertas. Los resultados de activación anteriores a GSR V2 no se usan para sostener la hipótesis.", "source": "documentacion/Cierre_Experimental_V2_01-11-2026.md", "kind": "cover"}, {"chapter": "01 · PUNTO DE PARTIDA", "title": "El problema de investigación", "body": "<div class=\"columns\"><div><p class=\"lead\">La atención y la activación<br>cambian durante una sesión.</p><p>Un resumen estático puede ocultar transiciones y dependencias entre momentos.</p></div><div><h3>Pregunta</h3><p class=\"question\">¿Incorporar historial mejora la predicción frente a un modelo que usa solo la ventana actual?</p></div></div><p class=\"takeaway\">La comparación debe aislar el aporte del historial.</p>", "notes": "La tesis parte de la temporalidad y la fusión multimodal. El contraste más reciente usa estadísticas del historial; no demuestra por sí solo que el orden de la secuencia aporte información.", "source": "../../documentos/01 Tesis MDS/Marco Teorico/Problema e hipótesis.md", "kind": ""}, {"chapter": "01 · PUNTO DE PARTIDA", "title": "Una hipótesis, dos resultados", "body": "<blockquote>Los modelos temporales multimodales obtienen un mejor desempeño fuera de muestra que los estáticos comparables.</blockquote><table><thead><tr><th>Resultado</th><th>Definición operacional</th></tr></thead><tbody><tr><td>Atención</td><td>Pseudoetiqueta a partir de mirada y pupila</td></tr><tr><td>Activación</td><td>Pseudoetiqueta a partir de GSR</td></tr></tbody></table><p class=\"takeaway\">La hipótesis conjunta requiere evidencia en ambas tareas.</p>", "notes": "La formulación del manuscrito habla de emociones y atención. Aquí se presenta activación como alcance operacional de la señal GSR, sin inferir valencia ni emociones discretas. Debe quedar explícito en la redacción final.", "source": "../../documentos/01 Tesis MDS/Marco Teorico/Problema e hipótesis.md", "kind": ""}, {"chapter": "02 · DATOS Y DISEÑO", "title": "Cuatro modalidades, sin etiqueta directa", "body": "<table><thead><tr><th>Modalidad</th><th>Información utilizada</th></tr></thead><tbody><tr><td>EEG</td><td>Actividad eléctrica y características espectrales</td></tr><tr><td>GSR</td><td>Componentes tónicos, fásicos y respuestas SCR</td></tr><tr><td>Eye tracking</td><td>Fijaciones, dispersión y trayectoria de mirada</td></tr><tr><td>Pupilometría</td><td>Cambios en el diámetro pupilar</td></tr></tbody></table><p class=\"takeaway\">Las etiquetas son aproximaciones derivadas de señales; no autorreportes ni medidas psicológicas independientes.</p>", "notes": "La Toma de Muestra 2 corresponde a registros de navegación web de 2025. No hay expresión facial en este conjunto. El alcance de cada señal debe distinguirse del constructo psicológico que se pretende aproximar.", "source": "../../documentos/01 Tesis MDS/Marco Teorico/Problema e hipótesis.md", "kind": ""}, {"chapter": "02 · DATOS Y DISEÑO", "title": "Separar la etiqueta de sus predictores", "body": "<table><thead><tr><th>Tarea</th><th>Profesor: construye la etiqueta</th><th>Estudiante: intenta predecirla</th></tr></thead><tbody><tr><td>Atención</td><td>Mirada + pupila</td><td>EEG + GSR</td></tr><tr><td>Activación</td><td>GSR</td><td>EEG + mirada + pupila</td></tr></tbody></table><p class=\"takeaway\">Las señales docentes no entran directamente como predictores de su propia etiqueta.</p>", "notes": "El profesor es una regla de construcción de pseudoetiquetas, no una verdad externa. La separación reduce circularidad directa. Normalización y umbrales personales del profesor siguen siendo offline.", "source": "resultados/profesor_binario_reconstruido_29-10-2026/INFORME.md; resultados/etiquetas_gsr_calidad_v2_01-11-2026/INFORME.md", "kind": ""}, {"chapter": "02 · DATOS Y DISEÑO", "title": "Evaluación por participante", "body": "<div class=\"numbers\"><div><strong>25</strong><span>entrenamiento</span></div><div><strong>8</strong><span>validación</span></div><div><strong>8</strong><span>test</span></div></div><p class=\"lead\">Ventanas de 2 segundos, desplazadas 1 segundo.</p><p class=\"takeaway\">Una persona pertenece a una sola partición. Las ventanas solapadas no son observaciones independientes.</p>", "notes": "41 participantes en las particiones principales. P29 se mantiene fuera del análisis principal por sensibilidad de sincronización. Los recuentos de ventanas cambian según la tarea y la versión de etiquetas. Validación y test tienen exposición histórica.", "source": "resultados/modelado/particion_participantes.csv; documentacion/Modelos_Temporales_07-09-2026.md", "kind": ""}, {"chapter": "03 · RECORRIDO EXPERIMENTAL", "title": "Cómo evolucionó el trabajo", "body": "<div class=\"timeline\"><div><b>Inicio</b><p>Sincronización, calidad y primeras pseudoetiquetas</p></div><div><b>Septiembre</b><p>Baselines, redes temporales y estrategias de fusión</p></div><div><b>Octubre</b><p>Atención binaria, reconstrucción docente y EEG por canal</p></div><div><b>Noviembre</b><p>GSR V2, recálculo, auditoría y protocolo de hipótesis</p></div></div>", "notes": "La evolución no es una curva de mejora de una única métrica: cambiaron tareas, etiquetas y representaciones. Las fechas son de las etapas de análisis, no de la adquisición de señales.", "source": "documentacion/Modelos_Temporales_07-09-2026.md; documentacion/Fusiones_10-09-2026.md; ../../notas/bitacora.md", "kind": ""}, {"chapter": "03 · RECORRIDO EXPERIMENTAL", "title": "Los primeros experimentos", "body": "<div class=\"columns\"><div><h3>Modelos</h3><p>Logística, bosques y controles estáticos.<br>TCN, LSTM y BiLSTM.<br>Clasificación y regresión.</p></div><div><h3>Comparaciones</h3><p>Ventana actual frente a historial.<br>Modalidades individuales y fusión.<br>Controles para separar arquitectura e historial.</p></div></div><p class=\"takeaway\">Esta etapa construyó el pipeline y los controles; sus etiquetas históricas requieren cautela.</p>", "notes": "En septiembre se guardaron 104 redes en la primera comparación temporal. También se exploraron fusión temprana y tardía, selección de variables, ensambles y otras arquitecturas. No se trasladan métricas antiguas al objetivo binario V2. La auditoría posterior detectó un problema en el generador histórico.", "source": "documentacion/Modelos_Temporales_07-09-2026.md; documentacion/Fusiones_10-09-2026.md; resultados/etiquetas_gsr_calidad_v2_01-11-2026/INFORME.md", "kind": ""}, {"chapter": "04 · ATENCIÓN", "title": "Reconstrucción del profesor de atención", "body": "<div class=\"columns\"><div><h3>Etiqueta relativa</h3><p>Score de mirada y pupila, convertido en dos clases respecto de la mediana personal.</p></div><div><h3>Control de entrenamiento</h3><p>Componentes recalculados desde las características. PCA ajustado dentro de cada fold.</p></div></div><p class=\"takeaway\">Se compararon profesores igualitario y PCA. Una AUC mayor no valida por sí sola el constructo de atención.</p>", "notes": "Reconstrucción del 29 de octubre: 25 participantes y 13.498 ventanas válidas de train; 26 omitidas por componentes incompletos. Cada profesor produjo 75 modelos estudiantes. La etiqueta usa normalización personal offline y no equivale a una medición psicológica independiente.", "source": "resultados/profesor_binario_reconstruido_29-10-2026/INFORME.md", "kind": ""}, {"chapter": "04 · ATENCIÓN", "title": "Recuperar información del EEG", "body": "<div class=\"numbers\"><div><strong>16</strong><span>canales conservados</span></div><div><strong>342</strong><span>nuevas entradas EEG</span></div></div><p class=\"lead\">Potencias por banda, descriptores espectrales,<br>características temporales y relaciones entre canales.</p><p class=\"takeaway\">Crudos recuperados desde Drive y verificados; extracción alineada con las ventanas originales.</p>", "notes": "La etapa previa agregaba EEG entre canales. Se recuperaron archivos crudos, verificando integridad, y se extrajeron características por canal. Se comprobaron muestras y selección temporal contra el procesamiento anterior. No se atribuye localización anatómica sin mapa de electrodos.", "source": "documentacion/Crudos_V2_y_EEG_Por_Canal_29-10-2026.md; resultados/temporalidad_eeg_v2_test_29-10-2026/auditoria_extraccion.json", "kind": ""}, {"chapter": "04 · ATENCIÓN", "title": "El modelo cercano a 0,67", "body": "<div class=\"hero-metric\">0,6744<span>AUC test · CatBoost estático · atención</span></div><p class=\"lead\">AUC en validación: <b>0,6798</b></p><p class=\"takeaway\">Es desempeño de atención. No es el resultado de activación GSR ni una prueba aislada del aporte temporal.</p>", "notes": "Este es el modelo encontrado que coincide con la referencia del usuario a 0,67; la identificación es provisional. La AUC evalúa discriminación y no es porcentaje de aciertos. El comparador estático emparejado con el HistBoost temporal tiene otra AUC.", "source": "resultados/temporalidad_eeg_v2_test_29-10-2026/INFORME.md; resultados/temporalidad_eeg_v2_validacion_29-10-2026/INFORME.md", "kind": ""}, {"chapter": "04 · ATENCIÓN", "title": "Comparación temporal emparejada", "body": "<table><thead><tr><th>Modelo · test</th><th>AUC</th></tr></thead><tbody><tr><td>HistBoost estático</td><td>0,6602</td></tr><tr><td>HistBoost + historial hasta 32</td><td><b>0,6879</b></td></tr></tbody></table><div class=\"delta\">+0,0277 <span>ΔAUC · IC95% [−0,0041; +0,0505]</span></div><p class=\"takeaway\">Mejora en 7 de 8 personas; el intervalo del contraste incluye cero.</p>", "notes": "La comparación mantiene familia y parámetros emparejados. Es el contraste histórico principal del 29 de octubre y no debe confundirse con la comparación contra CatBoost 0,6744. IC bootstrap pareado descriptivo; test previamente consultado.", "source": "resultados/temporalidad_eeg_v2_test_29-10-2026/INFORME.md", "kind": ""}, {"chapter": "04 · ATENCIÓN", "title": "Otra representación, otro experimento", "body": "<table><thead><tr><th>Comparación común · atención · test</th><th>AUC</th></tr></thead><tbody><tr><td>Estático</td><td>0,6602</td></tr><tr><td>Historial hasta 32</td><td>0,6927</td></tr></tbody></table><div class=\"delta\">+0,0325 <span>ΔAUC · IC95% [+0,0059; +0,0591]</span></div><p class=\"takeaway\">Resultado favorable exploratorio. La representación temporal cambió y el test ya había sido utilizado.</p>", "notes": "La comparación común del 30 de octubre usa media y desviación histórica de todas las variables. No es la misma representación de la diapositiva anterior. Debe conservarse este resultado favorable, pero no presentarlo como réplica confirmatoria independiente ni como justificación de elegir una representación después de ver test.", "source": "resultados/comparacion_comun_binaria_30-10-2026/INFORME.md", "kind": ""}, {"chapter": "05 · AUDITORÍA GSR", "title": "El diagnóstico cambió la prioridad", "body": "<div class=\"columns\"><div><h3>Calidad</h3><p>P4 tenía GSR válido en apenas el 12,6% de sus ventanas, pero todas recibían etiqueta.</p></div><div><h3>Consistencia</h3><p>Empates y clases muy desbalanceadas en algunas personas. Historial completo poco frecuente.</p></div></div><p class=\"takeaway\">Antes de seguir buscando modelos, había que revisar la construcción de las etiquetas.</p>", "notes": "P34 tenía aproximadamente 8,6% de positivos bajo la etiqueta binaria anterior. El diagnóstico de 60 ajustes internos y 15 modelos externos se reprodujo, pero reproducibilidad no equivale a validez del objetivo. Sus resultados se consideran históricos, no evidencia con GSR V2.", "source": "resultados/activacion_diagnostico_nested_30-10-2026/INFORME.md; ../../notas/bitacora.md", "kind": ""}, {"chapter": "05 · AUDITORÍA GSR", "title": "Un error de alineación confirmado", "body": "<p class=\"lead\">Al agrupar por participante y reiniciar índices,<br>los componentes podían asignarse a otras ventanas.</p><div class=\"hero-metric small\">25.498 / 25.992<span>posiciones de componentes desplazadas en el archivo completo</span></div><p class=\"takeaway\">Se reprodujeron los scores archivados con ese error. Los AUC de activación anteriores deben sustituirse por los recalculados.</p>", "notes": "La operación groupby/apply seguida de reset_index descartaba los índices originales. Las cifras corresponden al archivo completo, incluidos participantes fuera del análisis principal; no son el número de etiquetas binarias que cambiaron. Los errores máximos de reproducción fueron 4,82e-7 y 2,92e-7, compatibles con precisión de exportación. El patrón también aparece en atención histórica; no se extrapola a profesores reconstruidos posteriores.", "source": "resultados/etiquetas_gsr_calidad_v2_01-11-2026/INFORME.md; resultados/etiquetas_gsr_calidad_v2_01-11-2026/auditoria_independiente_02-11-2026.json", "kind": ""}, {"chapter": "05 · AUDITORÍA GSR", "title": "Etiquetas GSR V2", "body": "<ol class=\"steps\"><li><b>Calidad de señal</b><span>Cobertura ≥50%, cuatro componentes finitos y SCR no negativos.</span></li><li><b>Identidad conservada</b><span>Normalización personal con ventanas válidas, sin perder correspondencia.</span></li><li><b>Soporte temporal</b><span>Cinco ventanas consecutivas válidas; reinicio ante huecos o cambios de segmento.</span></li><li><b>Etiqueta binaria</b><span>Mediana personal; empates y scores sin variación quedan sin etiqueta.</span></li></ol>", "notes": "Cinco ventanas de dos segundos, desplazadas un segundo, cubren seis segundos. Los componentes observados constantes aportan cero; ausencias no se rellenan con cero. La mediana y normalización son offline. Esta revisión opera sobre características derivadas, no incorpora un detector fisiológico nuevo sobre señal cruda.", "source": "resultados/etiquetas_gsr_calidad_v2_01-11-2026/INFORME.md", "kind": ""}, {"chapter": "05 · AUDITORÍA GSR", "title": "Qué datos quedan para aprender", "body": "<table><thead><tr><th>Partición</th><th>Ventanas originales</th><th>Etiquetas V2</th></tr></thead><tbody><tr><td>Entrenamiento</td><td>13.524</td><td>7.028</td></tr><tr><td>Validación</td><td>4.662</td><td>2.584</td></tr><tr><td>Test</td><td>4.025</td><td>2.184</td></tr></tbody></table><p class=\"lead\"><b>11.796 etiquetas</b> · 53,1% de las ventanas principales</p><p class=\"takeaway\">La mayor reducción se debe al historial insuficiente, no a mala señal GSR.</p>", "notes": "Se preservan las 22.211 filas originales con motivo de exclusión. Sin etiqueta: 9.995 por historial insuficiente, 401 por cobertura/flag y 19 por empate. Las 41 personas conservan ambas clases. P4 conserva 26 ventanas etiquetables de 459. Los modelos comparados usan exactamente las mismas filas V2.", "source": "resultados/etiquetas_gsr_calidad_v2_01-11-2026/INFORME.md", "kind": ""}, {"chapter": "06 · RESULTADOS CORREGIDOS", "title": "Activación: mismo modelo, distinto historial", "body": "<table><thead><tr><th>Contexto máximo</th><th>Validación</th><th>Test</th></tr></thead><tbody><tr><td>Actual · estático</td><td>0,5182</td><td>0,5141</td></tr><tr><td>8 ventanas</td><td>0,5209</td><td><b>0,5470</b></td></tr><tr><td>32 ventanas · principal</td><td>0,5245</td><td>0,5363</td></tr></tbody></table><p class=\"takeaway\">AUC promedio por participante · HistGradientBoosting · EEG + mirada + pupila</p>", "notes": "Selección solo dentro de train: 30 ajustes internos, 15 modelos externos OOF y tres modelos finales. 15 hojas compartidas entre contextos. Se reentrenó el 2 de noviembre con resultados idénticos a la ejecución V2 previa. Test: 8 participantes y 2.184 ventanas. Contexto 8 es secundario, no nuevo ganador seleccionado por test.", "source": "resultados/activacion_gsr_v2_recalculo_02-11-2026/INFORME.md", "kind": ""}, {"chapter": "06 · RESULTADOS CORREGIDOS", "title": "La diferencia importa tanto como la AUC", "body": "<table><thead><tr><th>Temporal − estático · test</th><th>ΔAUC</th><th>IC descriptivo 95%</th></tr></thead><tbody><tr><td>Hasta 8 · secundario</td><td>+0,0329</td><td>[+0,0076; +0,0592]</td></tr><tr><td>Hasta 32 · principal</td><td>+0,0222</td><td>[−0,0130; +0,0585]</td></tr></tbody></table><p class=\"takeaway\">La señal favorable de 8 ventanas en test no se confirma en validación ni en OOF train.</p>", "notes": "El contraste de 8 mejora en 7/8 personas, pero en validación Δ=+0,00269 con IC [-0,0260;0,0333] y OOF Δ=-0,00194 con IC [-0,0495;0,0491]. No inferir diferencias comparando solapamiento de intervalos de AUC individuales: aquí se usan diferencias pareadas. Los intervalos son exploratorios, sin corrección por búsqueda histórica.", "source": "resultados/activacion_gsr_v2_recalculo_02-11-2026/contrastes.csv", "kind": ""}, {"chapter": "06 · RESULTADOS CORREGIDOS", "title": "¿La fusión supera a cada modalidad?", "body": "<table><thead><tr><th>Activación · AUC test</th><th>Actual</th><th>Hasta 8</th><th>Hasta 32</th></tr></thead><tbody><tr><td>EEG</td><td>0,4982</td><td>0,5123</td><td>0,5173</td></tr><tr><td>Mirada</td><td>0,5151</td><td>0,5129</td><td>0,5215</td></tr><tr><td>Pupila</td><td>0,5172</td><td>0,5461</td><td>0,5386</td></tr><tr><td>Fusión completa</td><td>0,5141</td><td>0,5470</td><td>0,5363</td></tr></tbody></table><p class=\"takeaway\">Los nueve intervalos de fusión menos modalidad individual en test incluyen cero.</p>", "notes": "Ablación V2 con 54 modelos nuevos, mismos hiperparámetros, participantes y filas. 63 recargas predictivas, 492 AUC y 27 contrastes auditados. Estas ablaciones comparan fusión temprana con modalidades individuales; no completan el contraste entre fusión temprana, intermedia y tardía bajo etiquetas corregidas.", "source": "resultados/ablacion_modalidades_v2_01-11-2026/INFORME.md", "kind": ""}, {"chapter": "06 · RESULTADOS CORREGIDOS", "title": "32 es un máximo, no el historial real", "body": "<div class=\"numbers\"><div><strong>8,73</strong><span>ventanas de historial medio<br>en test · contexto máximo 32</span></div><div><strong>0%</strong><span>de ventanas de test con<br>los 32 pasos completos</span></div></div><p class=\"takeaway\">La evaluación mide estadísticas del historial disponible. No prueba secuencias completas de 32 ni sensibilidad al orden.</p>", "notes": "Promedio ponderado por ventanas en test. Hasta 8 tiene historia media 5,06 y 40,8% de historias completas. Hasta 32 reinicia ante huecos, segmento o estímulo. En V2 solo se utilizan filas etiquetadas para la representación histórica, por lo que se omiten ventanas iniciales válidas sin etiqueta.", "source": "resultados/activacion_gsr_v2_recalculo_02-11-2026/INFORME.md", "kind": ""}, {"chapter": "07 · ESTADO DE LA HIPÓTESIS", "title": "Qué podemos sostener hoy", "body": "<div class=\"columns\"><div><h3>Evidencia disponible</h3><p>Atención: resultados favorables en algunos contrastes.<br><br>Activación: mejora secundaria en test, sin consistencia entre evaluaciones.</p></div><div><h3>Alcance</h3><p>La superioridad temporal conjunta sigue sin resolverse.<br><br>El test reutilizado no constituye una confirmación independiente.</p></div></div><p class=\"takeaway\">Reproducir un resultado confirma su ejecución; no garantiza validez de la etiqueta ni generalización.</p>", "notes": "No se concluye que la temporalidad nunca sirve. Tampoco se declara validada la hipótesis general. Distinguir discriminación de pseudoetiquetas, mejora frente al estático y validez psicológica. La versión actual documenta estas tres dimensiones por separado.", "source": "documentacion/Cierre_Experimental_V2_01-11-2026.md; resultados/activacion_gsr_v2_recalculo_02-11-2026/INFORME.md", "kind": ""}, {"chapter": "07 · SIGUIENTE ETAPA", "title": "Una regla de decisión antes de evaluar", "body": "<p class=\"lead\">Fijar qué mejora queremos demostrar<br>y contrastarla en participantes nuevos.</p><table><thead><tr><th>Paso</th><th>Decisión pendiente</th></tr></thead><tbody><tr><td>Efecto relevante</td><td>Justificar el margen; +0,02 AUC es solo un escenario</td></tr><tr><td>Comparación</td><td>Modelos, etiquetas y contexto principal fijados</td></tr><tr><td>Evaluación</td><td>Mismas personas y ventanas por tarea; incertidumbre pareada</td></tr></tbody></table><p class=\"takeaway\">Con un margen positivo se prueba una mejora relevante, no la mera existencia de cualquier mejora.</p>", "notes": "El protocolo propuesto usa intervalos simultáneos en ambas tareas. Respaldo si ambos límites inferiores superan el margen; refutación de esa afirmación acotada si algún límite superior queda debajo; si cruzan el margen, el resultado sigue inconcluso. Un diseño honesto no garantiza una decisión binaria.", "source": "resultados/protocolo_hipotesis_reintento_06-11-2026/INFORME.md", "kind": ""}, {"chapter": "07 · CIERRE", "title": "Avances y decisiones para discutir", "body": "<ol class=\"steps\"><li><b>Pipeline reconstruido y auditable</b><span>Datos, etiquetas, modelos y predicciones con trazabilidad.</span></li><li><b>Resultados corregidos y comparables</b><span>GSR V2, evaluación temporal y ablaciones sobre las mismas ventanas.</span></li><li><b>Próxima decisión metodológica</b><span>Alcance de la hipótesis, relevancia del efecto y factibilidad de evaluación independiente.</span></li></ol>", "notes": "Cierre de la exposición principal. El aporte actual incluye auditoría y corrección del objetivo, controles comparables y una interpretación delimitada. Los anexos profundizan en métrica, muestras y fuentes. No se ha recolectado una cohorte nueva ni ejecutado el protocolo prospectivo.", "source": "resultados/protocolo_hipotesis_reintento_06-11-2026/INFORME.md", "kind": "closing"}, {"chapter": "ANEXO A · MÉTRICA", "title": "Cómo leer la AUC", "body": "<div class=\"columns\"><div><div class=\"hero-metric small\">0,50<span>referencia de discriminación aleatoria</span></div></div><div><div class=\"hero-metric small\">1,00<span>ordenamiento perfecto de las dos clases</span></div></div></div><p class=\"lead\">AUC ≠ porcentaje de aciertos</p><p class=\"takeaway\">Promediamos AUC por persona y comparamos diferencias dentro de cada persona.</p>", "notes": "Una AUC cercana a 0,67 no significa 67% de etiquetas correctas a un umbral dado. La discriminación se refiere a las pseudoetiquetas definidas. Para la hipótesis importa ΔAUC temporal menos estático y su incertidumbre, no superar un valor aislado.", "source": "resultados/temporalidad_eeg_v2_test_29-10-2026/INFORME.md", "kind": ""}, {"chapter": "ANEXO B · PLANIFICACIÓN", "title": "El tamaño de muestra aún no está fijado", "body": "<table><thead><tr><th>Escenario piloto</th><th>Personas nuevas evaluables</th></tr></thead><tbody><tr><td>Atención · dispersión del test histórico</td><td>62</td></tr><tr><td>Activación · dispersión de validación</td><td>72</td></tr><tr><td>Activación · dispersión de test</td><td>101</td></tr><tr><td>Activación · dispersión de OOF train</td><td>767</td></tr></tbody></table><p class=\"takeaway\">Escenario: margen 0,02 y efecto verdadero 0,04 o 0,00. Estas cifras no son una recomendación definitiva de reclutamiento.</p>", "notes": "Potencia 90% por tarea, intervalos bilaterales de 97,5% para control simultáneo. Se verificó el cálculo con 100.000 simulaciones por escenario bajo normalidad. Las varianzas externas usan ocho personas y OOF mezcla modelos de folds distintos; 767 es sensibilidad conservadora, no requerimiento demostrado. El estudio conjunto no suma los N si las personas son las mismas. El margen carece aún de justificación sustantiva independiente.", "source": "resultados/protocolo_hipotesis_reintento_06-11-2026/INFORME.md; resultados/protocolo_hipotesis_reintento_06-11-2026/verificacion_simulada.json", "kind": ""}, {"chapter": "ANEXO C · TRAZABILIDAD", "title": "Documentación que sostiene el relato", "body": "<ol class=\"sources\"><li>Problema e hipótesis · manuscrito de investigación</li><li>Primeras redes y fusión · septiembre de 2026</li><li>Profesor reconstruido y EEG por canal · 29 de octubre</li><li>Temporalidad de atención y comparación común · 29–30 de octubre</li><li>GSR V2, auditoría y recálculo · 1–2 de noviembre</li><li>Ablaciones V2 y protocolo prospectivo · noviembre de 2026</li></ol><p class=\"takeaway\">Las notas de cada diapositiva incluyen su fuente local y las precisiones metodológicas.</p>", "notes": "Todas las cifras proceden de los informes y tablas locales. Las comparaciones con etiquetas anteriores se presentan como historia de desarrollo. Consultar FUENTES.md para rutas completas y GUIÓN.md para el contenido y notas de toda la presentación.", "source": "FUENTES.md", "kind": ""}];
